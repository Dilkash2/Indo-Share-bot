<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>File Verification</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        .header {
            background: #16a34a;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 21px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .step {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            flex: 1;
        }

        .circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            margin: 0 auto 6px;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .active .circle,
        .done .circle {
            background: #16a34a;
            color: white;
        }

        .active,
        .done {
            color: #16a34a;
        }

        .timer {
            text-align: center;
            font-size: 14px;
            color: #dc2626;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .ad-box {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 28px 10px;
            text-align: center;
            margin-bottom: 18px;
            color: #6b7280;
        }

        .ad-title {
            font-weight: bold;
            color: #111827;
            margin-bottom: 8px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 17px;
            font-weight: bold;
            background: #16a34a;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .success {
            display: none;
            text-align: center;
        }

        .success-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .small {
            text-align: center;
            color: #6b7280;
            font-size: 12px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="header">
    📁 FILE BOT
</div>

<div class="container">

    <div class="card">

        <div class="title">
            File Verification
        </div>

        <div class="subtitle">
            Complete the verification to unlock your file.
        </div>

        <div class="steps">

            <div class="step active" id="step1">
                <div class="circle">1</div>
                Watch
            </div>

            <div class="step" id="step2">
                <div class="circle">2</div>
                Verify
            </div>

            <div class="step" id="step3">
                <div class="circle">3</div>
                Done
            </div>

        </div>

        <div class="timer">
            Expires in <span id="mainTimer">5:00</span>
        </div>

        <div id="verification">

            <div class="ad-box">
                <div class="ad-title">
                    👀 Watch & Verify
                </div>

                <div>
                    Please wait while the verification timer completes.
                </div>

                <br>

                <div>
                    Ad timer:
                    <strong id="adTimer">20</strong>s
                </div>
            </div>

            <button id="continueBtn" disabled>
                Please wait...
            </button>

        </div>

        <div class="success" id="success">

            <div class="success-icon">
                ✅
            </div>

            <div class="title">
                Verification Complete
            </div>

            <div class="subtitle">
                Your file is ready.
            </div>

            <button id="getFileBtn">
                📥 GET FILE
            </button>

        </div>

        <div class="small">
            Do not close this page during verification.
        </div>

    </div>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const params = new URLSearchParams(window.location.search);

const fileCode = params.get("file");

let mainSeconds = 300;
let adSeconds = 20;

const mainTimer = document.getElementById("mainTimer");
const adTimer = document.getElementById("adTimer");
const continueBtn = document.getElementById("continueBtn");
const verification = document.getElementById("verification");
const success = document.getElementById("success");

const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");
const step3 = document.getElementById("step3");


// =========================
// MAIN 5 MINUTE TIMER
// =========================

const mainInterval = setInterval(function() {

    mainSeconds--;

    const minutes = Math.floor(mainSeconds / 60);
    const seconds = mainSeconds % 60;

    mainTimer.textContent =
        minutes + ":" + String(seconds).padStart(2, "0");

    if (mainSeconds <= 0) {

        clearInterval(mainInterval);

        alert("⏰ Verification expired.");

        tg.close();
    }

}, 1000);


// =========================
// 20 SECOND VERIFICATION
// =========================

const adInterval = setInterval(function() {

    adSeconds--;

    adTimer.textContent = adSeconds;

    if (adSeconds <= 0) {

        clearInterval(adInterval);

        continueBtn.disabled = false;
        continueBtn.textContent = "Continue →";

        step1.classList.remove("active");
        step1.classList.add("done");

        step2.classList.add("active");
    }

}, 1000);


// =========================
// CONTINUE
// =========================

continueBtn.addEventListener("click", function() {

    verification.style.display = "none";

    success.style.display = "block";

    step2.classList.remove("active");
    step2.classList.add("done");

    step3.classList.add("active");

});


// =========================
// GET FILE
// =========================

document.getElementById("getFileBtn").addEventListener(
    "click",
    function() {

        if (!fileCode) {

            alert("❌ File code nahi mila.");

            return;
        }

        /*
         * IMPORTANT:
         * This sends the file code back to the bot.
         */

        tg.sendData(fileCode);

    }
);

</script>

</body>
    </html>
